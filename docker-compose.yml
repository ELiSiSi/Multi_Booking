services:
  postgres:
    image: postgres:16-alpine
    container_name: reservio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservio}
      POSTGRES_DB: ${POSTGRES_DB:-reservio}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reservio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reservio-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - reservio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: reservio-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservio}:${POSTGRES_PASSWORD:-reservio}@postgres:5432/${POSTGRES_DB:-reservio}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reservio-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: reservio-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservio}:${POSTGRES_PASSWORD:-reservio}@postgres:5432/${POSTGRES_DB:-reservio}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reservio-network

  db-tools:
    build:
      context: .
      dockerfile: infrastructure/docker/tools.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservio}:${POSTGRES_PASSWORD:-reservio}@postgres:5432/${POSTGRES_DB:-reservio}
      REDIS_URL: redis://redis:6379
    working_dir: /repo/packages/database
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservio-network

volumes:
  postgres_data:
  redis_data:

networks:
  reservio-network:
    driver: bridge
